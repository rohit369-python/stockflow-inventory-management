[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stockflow-erp"
version = "0.1.0"
description = "Modular inventory and supply-chain ERP backend portfolio project"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3",
  "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<26", "psycopg[binary]>=3.2,<4",
  "redis>=5,<7", "celery[redis]>=5.4,<6", "email-validator>=2.2,<3", "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]
